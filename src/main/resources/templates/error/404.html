<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/head :: head('Page Not Found', '/css/pages/error.css')}"></head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="error-page">

    <section class="error-section">
        <div class="container">

            <div class="error-card">

                <span class="error-code">404</span>

                <h1 th:text="${errorTitle}">
                    Page Not Found
                </h1>

                <p th:text="${errorMessage}">
                    The requested page could not be found.
                </p>

                <div class="error-actions">

                    <a class="btn btn-khoury"
                       th:href="@{/}">
                        Go to Home
                    </a>

                    <a sec:authorize="isAuthenticated()"
                       class="btn btn-outline-secondary"
                       th:href="@{/orders/my-orders}">
                        My Orders
                    </a>

                    <a sec:authorize="isAnonymous()"
                       class="btn btn-outline-secondary"
                       th:href="@{/login}">
                        Sign In
                    </a>

                </div>

            </div>

        </div>
    </section>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script th:replace="~{fragments/footer :: bootstrapScript}"></script>

</body>
</html>
