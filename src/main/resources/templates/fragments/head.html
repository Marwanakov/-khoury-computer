<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head th:fragment="head(pageTitle, pageCss)">
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title th:text="${pageTitle} + ' | Khoury Computer'">Khoury Computer</title>

    <!-- Website icons -->
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}" />

    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      th:href="@{/images/brand/favicon-96.png}"
    />

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      th:href="@{/images/brand/apple-touch-icon.png}"
    />

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Shared styles -->
    <link rel="stylesheet" th:href="@{/css/main.css}" />
    <link rel="stylesheet" th:href="@{/css/layout.css}" />
    <link rel="stylesheet" th:href="@{/css/layout/header.css}" />
    <link rel="stylesheet" th:href="@{/css/layout/footer.css}" />
    <link rel="stylesheet" th:href="@{/css/components.css}" />

    <!-- Page-specific styles -->
    <link rel="stylesheet" th:href="@{${pageCss}}" />

    <!-- Google Analytics -->
    <script>
      const analyticsExcludedPaths = ["/admin", "/login"];

      const shouldTrack = !analyticsExcludedPaths.some((path) =>
        window.location.pathname.startsWith(path),
      );

      if (shouldTrack) {
        window.dataLayer = window.dataLayer || [];

        window.gtag = function () {
          dataLayer.push(arguments);
        };

        gtag("js", new Date());
        gtag("config", "G-2VB3WKKRT1");

        const analyticsScript = document.createElement("script");
        analyticsScript.async = true;
        analyticsScript.src =
          "https://www.googletagmanager.com/gtag/js?id=G-2VB3WKKRT1";

        document.head.appendChild(analyticsScript);
      }
    </script>

    <!-- Microsoft Clarity -->
    <script>
      if (shouldTrack) {
        (function (c, l, a, r, i, t, y) {
          c[a] =
            c[a] ||
            function () {
              (c[a].q = c[a].q || []).push(arguments);
            };
          t = l.createElement(r);
          t.async = 1;
          t.src = "https://www.clarity.ms/tag/" + i;
          y = l.getElementsByTagName(r)[0];
          y.parentNode.insertBefore(t, y);
        })(window, document, "clarity", "script", "ysyykh5a1m");
      }
    </script>
  </head>
</html>
