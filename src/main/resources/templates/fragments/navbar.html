<!--
Guest: Sign In and Register
CUSTOMER: My Profile, My Orders, Cart, and Logout
ADMIN: Admin Dashboard and Logout
-->

<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <body>
    <header th:fragment="navbar" class="site-header bg-white shadow-sm">
      <div class="container py-3">
        <div class="row align-items-center g-3">
          <!-- Logo placeholder: later we replace this with your father's real shop logo -->
          <div class="col-12 col-lg-3">
            <a class="brand-area text-decoration-none" th:href="@{/}">
              <div class="brand-logo">
                <img
                  th:src="@{/images/brand/khoury-computer-logo.jpg}"
                  alt="Khoury Computer logo"
                />
              </div>

              <div>
                <div class="brand-name">Khoury Computer</div>
                <div class="brand-subtitle">Computer shop &amp; repair</div>
              </div>
            </a>
          </div>

          <!-- Search bar -->
          <div class="col-12 col-lg-5">
            <form th:action="@{/products}" method="get" class="search-box">
              <input
                type="text"
                name="keyword"
                class="form-control search-input"
                placeholder="Search for laptops, accessories, chargers..."
                aria-label="Search products"
              />

              <button class="btn search-button" type="submit">Search</button>
            </form>
          </div>

          <!-- Account actions -->
          <div class="col-12 col-lg-4">
            <div class="header-actions justify-content-lg-end">
              <!-- Guest navigation -->
              <a
                sec:authorize="isAnonymous()"
                class="header-action-link"
                th:href="@{/login}"
              >
                Sign In
              </a>

              <a
                sec:authorize="isAnonymous()"
                class="btn btn-primary btn-sm px-3"
                th:href="@{/register}"
              >
                Register
              </a>

              <!-- Customer navigation -->
              <a
                sec:authorize="hasRole('CUSTOMER')"
                class="header-action-link"
                th:href="@{/profile}"
              >
                My Profile
              </a>

              <a
                sec:authorize="hasRole('CUSTOMER')"
                class="header-action-link"
                th:href="@{/orders/my-orders}"
              >
                My Orders
              </a>

              <a
                sec:authorize="hasRole('CUSTOMER')"
                class="header-action-link"
                th:href="@{/cart}"
              >
                Cart
              </a>

              <!-- Admin navigation -->
              <a
                sec:authorize="hasRole('ADMIN')"
                class="header-action-link"
                th:href="@{/admin}"
              >
                Admin Dashboard
              </a>

              <a
                sec:authorize="hasRole('ADMIN')"
                class="header-action-link"
                th:href="@{/admin/overview}"
              >
                Admin Overview
              </a>

              <!-- Authenticated navigation -->
              <form
                sec:authorize="isAuthenticated()"
                th:action="@{/logout}"
                method="post"
                class="m-0"
              >
                <button type="submit" class="header-logout-button">
                  Logout
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>

      <!-- Main store navigation -->
      <nav class="category-nav border-top">
        <div class="container">
          <div class="category-nav-scroll">
            <a class="category-nav-link" th:href="@{/}"> Home </a>

            <a class="category-nav-link" th:href="@{/products}"> Products </a>

            <div class="dropdown category-dropdown">
              <button
                class="category-nav-link category-dropdown-button"
                type="button"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                Categories

                <span class="category-dropdown-arrow" aria-hidden="true">
                  ▾
                </span>
              </button>

              <ul class="dropdown-menu category-dropdown-menu">
                <li>
                  <a
                    class="dropdown-item category-dropdown-item"
                    th:href="@{/products}"
                  >
                    All Products
                  </a>
                </li>

                <li>
                  <hr class="dropdown-divider" />
                </li>

                <li
                  th:each="category
                        : ${navigationCategories}"
                >
                  <a
                    class="dropdown-item category-dropdown-item"
                    th:href="@{/products(
                               categoryId=${category.id()}
                           )}"
                    th:text="${category.name()}"
                  >
                    Category
                  </a>
                </li>

                <li
                  th:if="${#lists.isEmpty(
                        navigationCategories
                    )}"
                >
                  <span class="dropdown-item-text category-dropdown-empty">
                    No categories available
                  </span>
                </li>
              </ul>
            </div>

            <a class="category-nav-link" th:href="@{/deals}"> Deals </a>

            <a class="category-nav-link" th:href="@{/new-arrivals}">
              New Arrivals
            </a>

            <a class="category-nav-link" th:href="@{/contact}">
              Repair Services
            </a>
          </div>
        </div>
      </nav>
    </header>
  </body>
</html>
